<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sonicos Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<style>
:root{
  --bg:#0e0e0e;--panel:#141414;--panel2:#1a1a1a;--line:#262626;--line2:#333;
  --text:#f1efea;--muted:#8b8b86;--dim:#5c5c58;
  --accent:#ff4a1c;--accent-ink:#0e0e0e;--ok:#4fd18b;--warn:#f2b441;--err:#ff5d5d;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 16px;background:var(--bg)}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 8px 28px}
.logo{font-weight:600;font-size:22px;letter-spacing:-.04em;display:flex;align-items:center;gap:10px}
.logo i{display:inline-block;width:14px;height:14px;background:var(--accent)}
.menu-btn{display:none;background:none;border:0;font-family:var(--mono);font-size:12px;letter-spacing:.08em;cursor:pointer;padding:8px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;text-decoration:none;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-left:2px solid transparent;transition:color .15s,background .15s}
.nav a:hover{color:var(--text);background:var(--panel)}
.nav a.on{color:var(--text);border-left-color:var(--accent);background:var(--panel)}
.nav svg{width:16px;height:16px;flex:none}
.side-foot{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}.dot.acc{background:var(--accent)}
.main{min-width:0;padding:40px clamp(20px,4vw,56px) 80px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.page-head h1{font-weight:300;font-size:clamp(34px,5vw,56px);line-height:1.02;letter-spacing:-.035em;margin:10px 0 8px}
.page-head p{margin:0;color:var(--muted);max-width:56ch}

/* buttons — mono caps, square, optional attached plus */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);padding:11px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:filter .15s,background .15s,border-color .15s;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--text);filter:none}
.btn.danger{background:transparent;color:var(--err);border-color:#5a2a2a}
.btn.danger:hover{background:#2a1313;filter:none}
.btn.sm{padding:7px 10px;font-size:11px}
.btn.plus{padding:11px 14px;margin-left:6px}
.btn-group{display:inline-flex}
.lnk{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid transparent}
.lnk:hover{border-bottom-color:var(--accent)}
.lnk.ul{color:var(--text);border-bottom-color:var(--text)}

/* cards, grid */
.card{background:var(--panel);border:1px solid var(--line);padding:22px}
.card+.card{margin-top:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.link-card{margin-top:0}
.grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px;gap:0;background:none;border:0;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.grid.stats .tile{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile{background:var(--panel);padding:20px 22px}
.tile .v{font-weight:300;font-size:38px;letter-spacing:-.03em;line-height:1.1;margin-top:10px;word-break:break-word}
.tile .v.sm{font-size:26px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.cols .card+.card{margin-top:0}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 16px;margin:0}
.kv dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0;word-break:break-word}

/* forms */
.form{display:grid;gap:20px;max-width:720px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.field label,.lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field .hint{font-size:13px;color:var(--dim);margin-top:6px}
input[type=text],input[type=password],input[type=tel],input[type=search],input[type=url],input[type=number],select,textarea{width:100%;background:#0b0b0b;border:1px solid var(--line2);padding:11px 12px;border-radius:0;transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:#4a4a4a}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:92px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=range]{accent-color:var(--accent);padding:0;border:0;background:none}
.sw{position:relative;display:inline-block;width:40px;height:22px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border:1px solid var(--line2);background:#0b0b0b;transition:.15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--dim);transition:.15s}
.sw input:checked+span{border-color:var(--accent)}
.sw input:checked+span::after{left:21px;background:var(--accent)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sw input:disabled{cursor:not-allowed}.sw input:disabled+span{opacity:.5}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 0;border-top:1px solid var(--line)}
.toggle-row:first-of-type{border-top:0}
.toggle-row b{font-weight:500;display:block}
.toggle-row small{color:var(--muted);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input[type=search]{flex:1;min-width:200px}
.toolbar select{width:auto;min-width:150px}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:24px;overflow:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 18px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#171717}
td.r,th.r{text-align:right}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);padding:2px 7px;color:var(--muted)}
.tag.acc{border-color:var(--accent);color:var(--accent)}
.tag.ok{border-color:#235a3d;color:var(--ok)}.tag.warn{border-color:#5a4a1d;color:var(--warn)}.tag.err{border-color:#5a2a2a;color:var(--err)}
.conf{display:inline-block;width:72px;height:6px;background:var(--line);vertical-align:middle;margin-right:8px}
.conf i{display:block;height:100%;background:var(--accent)}
.sev{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}

/* states */
.sk{height:14px;margin:12px 0;background:linear-gradient(90deg,#1a1a1a 25%,#242424 50%,#1a1a1a 75%);background-size:200% 100%;animation:sh 1.4s linear infinite}
.sk.tile-sk{height:84px;margin:0}
@keyframes sh{to{background-position:-200% 0}}
.empty,.errbox{padding:44px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2)}
.empty b,.errbox b{display:block;color:var(--text);font-weight:500;font-size:16px;margin-bottom:6px}
.errbox{border-color:#5a2a2a}.errbox b{color:var(--err)}
.errbox .btn{margin-top:14px}
.banner{display:flex;gap:12px;align-items:center;padding:14px 18px;border:1px solid var(--line2);background:var(--panel);margin-bottom:20px}
.banner.ok{border-color:#235a3d}.banner.warn{border-color:#5a4a1d}.banner.err{border-color:#5a2a2a}
.offline{position:sticky;top:0;z-index:50;background:#2a1313;border-bottom:1px solid #5a2a2a;color:#ffb4b4;padding:10px 20px;font-family:var(--mono);font-size:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.offline button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;font:inherit;padding:0}

/* connection */
.link-grid{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:24px;align-items:start}
.qr-box{position:relative;background:#fff;padding:16px;aspect-ratio:1;display:grid;place-items:center;color:#111}
.qr-box::before,.qr-box::after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--accent)}
.qr-box::before{top:-6px;left:-6px;border-right:0;border-bottom:0}
.qr-box::after{bottom:-6px;right:-6px;border-left:0;border-top:0}
.qr-box svg{width:100%;height:auto;display:block}
.qr-box img{width:100%;height:auto;display:block;image-rendering:pixelated}
.qr-wait{background:var(--panel2);color:var(--muted);text-align:center;padding:24px;font-size:14px}
.qr-over{position:absolute;inset:0;background:rgba(14,14,14,.92);color:var(--text);display:grid;place-items:center;text-align:center;padding:20px;gap:12px;align-content:center}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;color:var(--muted)}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:2px}
.steps li b{color:var(--text);font-weight:500}
.code{font-family:var(--mono);font-weight:500;font-size:clamp(30px,6vw,46px);letter-spacing:.14em;color:var(--accent);background:#0b0b0b;border:1px solid var(--line2);padding:18px 22px;display:inline-block;user-select:all}
.phone-row{display:grid;grid-template-columns:minmax(140px,180px) minmax(0,1fr);gap:10px}
.phone-row>*{min-width:0}

/* dialogs & toasts */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line2);padding:0;width:min(560px,92vw);max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.72)}
.dlg-b{padding:26px}
.dlg-b h3{font-weight:400;font-size:26px;letter-spacing:-.02em;margin:0 0 10px}
.dlg-b p{color:var(--muted);margin:0 0 22px}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:100;max-width:min(380px,calc(100vw - 40px))}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:12px 16px;font-size:14px;animation:in .2s ease-out}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--err)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

/* auth/setup */
.screen{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth{width:min(440px,100%)}
.auth.wide{width:min(960px,100%)}
.auth h1{font-weight:300;font-size:clamp(36px,8vw,52px);letter-spacing:-.035em;line-height:1.02;margin:18px 0 12px}
.auth p{color:var(--muted);margin:0 0 28px}
.auth .form{max-width:none}
.err-t{color:var(--err);font-size:14px;min-height:1.3em}

@media(max-width:1180px){
  .main .link-grid{grid-template-columns:1fr}
}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:column;padding:12px 16px;z-index:40;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0}
  .menu-btn{display:block}
  .nav,.side-foot{display:none}
  .side.open .nav{display:flex;padding:12px 0}
  .side.open .side-foot{display:grid}
  .main{padding-top:28px}
  .link-grid{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dd{margin-bottom:10px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="offline" class="offline" hidden role="alert">
  <span>Backend unreachable. Check that the bot is running and the API URL is correct.</span>
  <button id="off-retry" type="button">Retry</button>
  <button id="off-url" type="button">Change URL</button>
</div>

<main id="screen" class="screen" hidden></main>

<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><i></i>SONICOS</div>
      <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav">MENU ≡</button>
    </div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <span class="chip" title="Live update channel"><span class="dot" id="live-dot"></span><span id="live-txt">Connecting…</span></span>
      <span class="chip" title="WhatsApp connection"><span class="dot" id="wa-dot"></span><span id="wa-txt">WhatsApp —</span></span>
      <span id="api-host" style="word-break:break-all"></span>
      <button class="btn ghost sm" id="signout" type="button">Sign out</button>
    </div>
  </aside>
  <section class="main"><div id="view" aria-live="polite"></div></section>
</div>

<dialog id="dlg"><form method="dialog" class="dlg-b">
  <h3 id="dlg-t"></h3><p id="dlg-p"></p>
  <div class="dlg-f"><button class="btn ghost" value="cancel">Cancel</button><button class="btn" id="dlg-ok" value="ok">Confirm</button></div>
</form></dialog>
<dialog id="modal"></dialog>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   CONFIG — edit this block to match your Go backend.
   Set DEFAULT_API_BASE to your deployed bot (e.g. Railway) or leave it
   empty and the dashboard will ask for the URL on first load.
   Nothing secret lives in this file. Auth is an HttpOnly cookie.
   ===================================================================== */
const DEFAULT_API_BASE = '';
/* Demo mode: serves generated data from inside the page, no backend needed.
   Set to false (or open the page with ?mock=0) to talk to the real backend. */
const MOCK = new URLSearchParams(location.search).get('mock') === '1';
const enc = encodeURIComponent;
const EP = {
  login:'/auth/login', logout:'/auth/logout', me:'/auth/me',
  status:'/status', events:'/events',
  qr:'/qr', qrRefresh:'/connection/qr/refresh', pair:'/pair',
  reconnect:'/connection/reconnect', disconnect:'/connection/disconnect', unlink:'/connection/unlink',
  settings:'/settings', prefix:'/commands/prefix',
  commands:'/commands', command:n=>`/commands/${enc(n)}`,
  groups:'/groups', group:id=>`/groups/${enc(id)}`,
  modSettings:'/moderation/settings',
  modEnrolled:'/moderation/enrolled', modEnrolledItem:id=>`/moderation/enrolled/${enc(id)}`,
  modMatches:'/moderation/matches', modReview:id=>`/moderation/matches/${enc(id)}/review`,
  modHistory:'/moderation/history',
  users:'/users', userHistory:id=>`/users/${enc(id)}/history`, userReset:id=>`/users/${enc(id)}/warnings/reset`,
  logs:'/logs'
};

/* ---------- tiny helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = n=>n==null||n===''||isNaN(n)?'—':Number(n).toLocaleString();
const fmtTime = t=>{ if(!t) return '—'; const d=new Date(t); return isNaN(d)?'—':d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'medium'}); };
const fmtDur = s=>{ if(s==null||isNaN(s)) return '—'; s=Math.max(0,Math.floor(s)); const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60; return d?`${d}d ${h}h ${m}m`:h?`${h}h ${String(m).padStart(2,'0')}m ${String(x).padStart(2,'0')}s`:`${m}m ${String(x).padStart(2,'0')}s`; };
const items = d=>Array.isArray(d)?d:(d&&Array.isArray(d.items)?d.items:[]);
const totalOf = (d,fallback)=>d&&typeof d.total==='number'?d.total:fallback;
const pct = c=>{ c=Number(c); if(isNaN(c)) return 0; return Math.round(Math.min(100,Math.max(0,c<=1?c*100:c))); };
const maskId = j=>{ const p=String(j||'').split('@')[0].split(':')[0]; return p.length>4?`+••••${p.slice(-4)}`:p||'—'; };
const phoneOf = j=>{ const p=String(j||'').split('@')[0].split(':')[0]; return p?`+${p}`:''; };
const debounce=(fn,ms=300)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};

const ICON = {
  overview:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
  connection:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  settings:'<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  commands:'<path d="M4 17l6-6-6-6"/><path d="M12 19h8"/>',
  groups:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5a3 3 0 0 1 0 6M18 14c1.8.8 3 2.6 3 6"/>',
  moderation:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/>',
  users:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
  logs:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'
};
const ico = n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true">${ICON[n]||''}</svg>`;

const state = { base:'', status:null, statusAt:0, live:'off', es:null, poll:null, onboarded:false };

class ApiError extends Error{ constructor(m,status,data){ super(m); this.status=status; this.data=data; } }
const bus = (()=>{ const h={}; return {
  on(t,f){ (h[t]=h[t]||new Set()).add(f); return ()=>h[t].delete(f); },

function setOffline(v){ $('#offline').hidden=!v; }
async function api(path,{method='GET',body}={}){
  if(MOCK) return mockApi(path,method,body);
  if(!state.base) throw new ApiError('No backend URL configured',0);
  const headers={Accept:'application/json'};
  if(method!=='GET'){ headers['Content-Type']='application/json'; headers['X-Requested-With']='sonicos-dashboard'; }
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),20000);
  let res;
  try{
    res=await fetch(state.base+path,{method,headers,credentials:'include',body:body===undefined?undefined:JSON.stringify(body),signal:ctrl.signal});
  }catch(e){ setOffline(true); throw new ApiError('Cannot reach the backend',0); }
  finally{ clearTimeout(to); }
  setOffline(false);
  const ct=res.headers.get('content-type')||''; let data=null;
  try{
    if(res.status===204) data=null;
    else if(ct.includes('json')) data=await res.json();
    else if(ct.startsWith('image/')) data=await res.blob();
    else data=await res.text();
  }catch{}
  if(res.status===401){ if(path!==EP.login&&path!==EP.me) onUnauthorized(); throw new ApiError((data&&data.error)||'Not signed in',401,data); }
  if(!res.ok) throw new ApiError((data&&data.error)||(typeof data==='string'&&data.trim().slice(0,200))||`Request failed (${res.status})`,res.status,data);
  return data;
}

/* ---------- status normalisation (accepts your current /status shape too) ---------- */
function normStatus(r){
  r=r||{}; const st=r.stats||{};
  const connected=r.connected ?? (r.state==='connected');
  const jid=r.account&&r.account.jid || r.account_id || null;
  const account=(r.account||jid)?{ jid, phone:(r.account&&r.account.phone)||r.phone||phoneOf(jid), name:(r.account&&r.account.name)||r.push_name||null }:null;
  return {
    connected:!!connected, state:r.state||(connected?'connected':'disconnected'), account,
    uptime:r.uptime_seconds??null, since:r.connected_since||null,
    stats:{ messages:st.messages??r.total_messages, groups:st.groups??r.active_groups, users:st.users??r.total_users,
            moderation:st.moderation_events??r.moderation_events, warnings:st.warnings??r.total_warnings },
    health:Array.isArray(r.health)?r.health:[], maintenance:!!r.maintenance, version:r.version||null
  };
}
function applyStatus(raw){
  const s=normStatus(raw); state.status=s; state.statusAt=Date.now();
  const labels={connected:['ok','Connected'],connecting:['warn','Connecting'],qr:['warn','Awaiting QR scan'],pairing:['warn','Awaiting pairing'],disconnected:['err','Disconnected']};
  const [cls,txt]=labels[s.state]||['','Unknown'];
  $('#wa-dot').className='dot '+cls; $('#wa-txt').textContent='WhatsApp: '+txt;
  bus.emit('status',s); return s;
}
function connectedSeconds(s){
  if(s.since){ const d=Date.parse(s.since); if(!isNaN(d)) return (Date.now()-d)/1000; }
  return s.uptime==null?null:s.uptime+(Date.now()-state.statusAt)/1000;
}
async function refreshStatus(){ const r=await api(EP.status); return applyStatus(r); }

/* ---------- live updates: SSE with polling fallback ---------- */
function setLive(mode){
  state.live=mode;
  $('#live-dot').className='dot '+({live:'ok',polling:'warn',off:'err'}[mode]||'');
  $('#live-txt').textContent={live:'Live updates',polling:'Polling every 5s',off:'Updates paused'}[mode]||'';
}
function startPolling(){
  if(state.poll) return;
  state.poll=setInterval(async()=>{ try{ await refreshStatus(); bus.emit('poll'); }catch{} },5000);
}
function stopPolling(){ clearInterval(state.poll); state.poll=null; }
function startLive(){
  stopLive();
  if(MOCK){ setLive('live'); $('#live-txt').textContent='Live · demo data'; mockStartSim(); return; }
  if(!window.EventSource){ setLive('polling'); startPolling(); return; }
  const es=new EventSource(state.base+EP.events,{withCredentials:true}); state.es=es;
  es.onopen=()=>{ setLive('live'); stopPolling(); };
  ['status','qr','pairing','activity','moderation'].forEach(t=>es.addEventListener(t,e=>{
    let d; try{ d=JSON.parse(e.data); }catch{ return; }
    if(t==='status') applyStatus(d); else bus.emit(t,d);
  }));
  es.onerror=()=>{ setLive('polling'); startPolling(); };
}
function stopLive(){ if(state.es){ state.es.close(); state.es=null; } stopPolling(); if(MOCK) mockStopSim(); setLive('off'); }

function pairPanel(el){

views.connection=async root=>{
  root.innerHTML=head('WhatsApp','Connection','Link your WhatsApp account via QR code scan or phone number pairing.')+`<div id="cx">${skel(5)}</div>`;
  const cx=$('#cx'); let tick;
  function connectedView(s){
    const a=s.account||{};
    cx.innerHTML=`<div class="banner ok"><span class="dot ok"></span><b>Connected to WhatsApp</b></div>
    <div class="card"><div class="card-h"><span>Linked account</span></div>
    <dl class="kv"><dt>Phone</dt><dd class="mono">${esc(a.phone||'—')}</dd><dt>Name</dt><dd>${esc(a.name||'—')}</dd><dt>Status</dt><dd><span class="tag ok">Session active</span></dd><dt>Connected for</dt><dd class="mono" id="cx-dur">${fmtDur(connectedSeconds(s))}</dd></dl>
    <div class="actions" style="margin-top:24px"><button class="btn ghost" id="b-rec" type="button">Reconnect</button><button class="btn ghost" id="b-dis" type="button">Disconnect</button><button class="btn danger" id="b-unl" type="button">Unlink account</button></div>
    <p class="muted" style="font-size:13px;margin:18px 0 0"><b style="color:var(--text);font-weight:500">Disconnect</b> stops the bot but keeps the session so it can reconnect. <b style="color:var(--text);font-weight:500">Unlink</b> removes the session; you will need to scan a new QR or enter a new pairing code.</p></div>`;
    $('#b-rec').onclick=e=>run(e.target,async()=>{ await api(EP.reconnect,{method:'POST'}); refreshStatus().catch(()=>{}); },'Reconnecting…');
    $('#b-dis').onclick=async e=>{ if(await confirmDialog({title:'Disconnect the bot?',body:'The bot will stop responding until it is reconnected. Your linked session is kept.',confirmText:'Disconnect'})) run(e.target,async()=>{ await api(EP.disconnect,{method:'POST'}); await refreshStatus(); },'Disconnected'); };
    $('#b-unl').onclick=async e=>{ if(await confirmDialog({title:'Unlink this WhatsApp account?',body:'This deletes the bot’s session. To use the bot again you must pair a WhatsApp account from scratch.',confirmText:'Unlink',danger:true})) run(e.target,async()=>{ await api(EP.unlink,{method:'POST'}); qr=null; pair=null; await refreshStatus(); await loadQR(); },'Account unlinked'); };
  }
  function linkView(s){
    const msgs={connecting:['warn','Connecting to WhatsApp…'],waiting:['warn','Preparing WhatsApp pairing session…'],qr:['warn','Waiting for you to scan the QR code.'],pairing:['warn','Waiting for you to enter the pairing code on your phone.'],error:['err','Pairing error. Refresh QR or try phone pairing.'],disconnected:['err','Not linked. Choose a method below to connect.']};
    const [c,m]=msgs[s.state]||msgs.disconnected;
    cx.innerHTML=`<div class="banner ${c}"><span class="dot ${c}"></span><span>${esc(m)}</span></div>
    <div class="link-grid" id="cx-grid">
      <div class="card link-card" id="cx-qr"></div>
      <div class="card link-card" id="cx-pair"></div>
    </div>`;
    qrPanel($('#cx-qr'));
    pairPanel($('#cx-pair'));
  }
  function render(){
    const s=state.status; if(!s){ cx.innerHTML=skel(5); return; }
    s.connected?connectedView(s):linkView(s);
  }
  function cd(){
    const ds=state.status; const d=$('#cx-dur'); if(d&&ds&&ds.connected) d.textContent=fmtDur(connectedSeconds(ds));
    const q=$('#q-cd'); if(q&&qr&&qr.expires){ const left=Math.round((qr.expires-Date.now())/1000); q.textContent=left>0?`Code refreshes in ${left}s`:'Code expired'; if(left===0&&$('#cx-qr')) qrPanel($('#cx-qr')); }
    const p=$('#p-cd'); if(p&&pair&&pair.expires){ const left=Math.round((pair.expires-Date.now())/1000); p.textContent=left>0?`Code expires in ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'Code expired. Request a new one.'; }
  }
  let last=null;
  const onStatus=s=>{
    const was=last; last=s.state; if(!$('#cx')) return;
    if(s.connected&&was&&was!=='connected') toast('WhatsApp connected','ok');
    render();
    if(!s.connected&&s.state!=='pairing'&&(was!==s.state||!qr)) loadQR();
  };
  const off=[bus.on('status',onStatus),bus.on('qr',d=>{ qr=d&&(d.qr||d.code||d.qr_image)?{code:d.qr||d.code||null,image:d.qr_image||null,expires:d.expires_at?Date.parse(d.expires_at):null,state:d.state||null}:null; qrErr=d&&d.error?d.error:''; if(state.status&&!state.status.connected&&$('#cx-qr')) qrPanel($('#cx-qr')); }),
    bus.on('pairing',d=>{ if(d&&d.state==='failed'){ toast(d.error||'Pairing failed','err'); pair=null; paintPair($('#cx-pair')); } }),
    bus.on('poll',()=>{ const s=state.status; if(s&&!s.connected) loadQR(); })];
  tick=setInterval(cd,1000);
  try{ await refreshStatus(); }catch(e){ errBox(cx,e,()=>views.connection(root)); return ()=>{ off.forEach(f=>f()); clearInterval(tick); }; }
  last=state.status.state; render(); if(!state.status.connected) await loadQR();
  return ()=>{ off.forEach(f=>f()); clearInterval(tick); };
};

  if(p==='/__mock/connect'){ M.linked=true; c.state='connected'; c.since=Date.now(); mockLog('info','connection','WhatsApp connected'); mockPush(); return {ok:true}; }
  if(p===EP.qr){
    if(c.state==='connected') bad('Already connected',409);
    if(c.state==='disconnected'){ c.state='qr'; M.qr=newQR(); setTimeout(mockPush,30); }
    return {state:'qr',qr:M.qr.code,expires_at:iso(M.qr.expires)};
  }
  if(p===EP.qrRefresh&&post){ M.qr=newQR(); if(c.state==='disconnected'){ c.state='qr'; mockPush(); } bus.emit('qr',{qr:M.qr.code,expires_at:iso(M.qr.expires)}); return {ok:true}; }
  if(p===EP.pair&&post){
    if(!body||!/^\d{1,4}$/.test(body.country_code||'')||!/^\d{6,13}$/.test(body.phone_number||'')) bad('Enter a valid phone number.');
    if(c.state==='connected') bad('Already connected. Unlink the account first.',409);
    c.state='pairing'; mockPush();
    const code=Array.from({length:8},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[rnd(0,31)]).join('');
    return {pairing_code:code,expires_at:iso(Date.now()+120000)};
  }
  if(p===EP.reconnect&&post){ c.state='connecting'; mockPush(); setTimeout(()=>{ c.state='connected'; c.since=Date.now(); mockLog('info','connection','WhatsApp reconnected'); mockPush(); },1600); return {ok:true}; }
  if(p===EP.disconnect&&post){ c.state='disconnected'; mockLog('warning','connection','Disconnected from dashboard'); mockPush(); return {ok:true}; }
  if(p===EP.unlink&&post){ c.state='disconnected'; M.linked=false; mockLog('warning','connection','Account unlinked from dashboard'); mockPush(); return {ok:true}; }
  if(p===EP.settings){
    if(method==='PUT'){ ['bot_name','description','language','timezone','auto_start','maintenance'].forEach(k=>{ if(body&&k in body) M.settings[k]=body[k]; }); mockLog('info','config','Settings updated from dashboard'); mockPush(); }
    return {...M.settings};
  }
  if(p===EP.prefix&&post){ if(!body||!/^\S{1,3}$/.test(body.prefix||'')) bad('Invalid prefix.'); M.settings.prefix=body.prefix; mockLog('info','config',`Command prefix changed to “${body.prefix}”`); return {ok:true}; }
  if(p===EP.commands) return M.commands.map(x=>({...x}));
  if(p.startsWith(EP.commands+'/')&&method==='PATCH'){
    const cm=M.commands.find(x=>x.name===tail(EP.commands+'/')); if(!cm) bad('Unknown command',404);
    if('enabled' in body) cm.enabled=!!body.enabled; if(body.permission) cm.permission=body.permission;
    mockLog('info','config',`Command ${cm.name} updated`); return {...cm};
  }
  if(p===EP.groups) return M.groups.map(({admins,disabled_commands,welcome_message,...r})=>r);
  if(p.startsWith(EP.groups+'/')){
    const gr=M.groups.find(x=>x.id===tail(EP.groups+'/')); if(!gr) bad('Group not found',404);
    if(method==='PATCH'){ Object.assign(gr,body); mockLog('info','group',`Settings changed for ${gr.name}`); }
    return {...gr};
  }
  if(p===EP.modSettings){ if(method==='PUT'){ Object.assign(M.mod,body); mockLog('info','config','Moderation settings updated'); } return {...M.mod}; }
  if(p===EP.modEnrolled) return M.enrolled.map(x=>({...x}));
  if(p.startsWith(EP.modEnrolled+'/')&&method==='DELETE'){ const id=tail(EP.modEnrolled+'/'); M.enrolled=M.enrolled.filter(x=>x.id!==id); mockLog('info','moderation',`Enrolled reference removed`); return null; }
  if(p===EP.modMatches) return (g('tier')==='possible'?M.matches.possible:M.matches.high).map(x=>({...x}));
  if(/^\/moderation\/matches\/[^/]+\/review$/.test(p)&&post){
    const id=decodeURIComponent(p.split('/')[3]), i=M.matches.possible.findIndex(x=>x.id===id); if(i<0) bad('Detection not found',404);
    const [m]=M.matches.possible.splice(i,1);
    if(body.decision==='confirm'){
      const us=M.users.find(x=>x.jid===m.user); if(us) us.warnings++;
      M.history.unshift({ts:iso(Date.now()),user:m.user,user_name:m.user_name,group:'',group_name:m.group_name,action:'warning',dry_run:M.mod.dry_run,detail:'Confirmed by admin review'});
      m.status='confirmed'; M.matches.high.unshift(m); mockLog('info','moderation',`Detection confirmed in ${m.group_name}`);
    } else mockLog('info','moderation','Detection dismissed as false positive');
    return {ok:true};
  }
  if(p===EP.modHistory) return paged(M.history);
  if(p===EP.users){
    const s=g('q').toLowerCase(), gr=g('group');
    return paged(M.users.filter(x=>(!s||x.name.toLowerCase().includes(s))&&(!gr||x.group===gr)));
  }
  if(/^\/users\/[^/]+\/history$/.test(p)){ const jid=decodeURIComponent(p.split('/')[2]), us=M.users.find(x=>x.jid===jid); if(!us) bad('User not found',404); return {warnings:us.warnings,history:M.history.filter(h=>h.user===jid).slice(0,15)}; }
  if(/^\/users\/[^/]+\/warnings\/reset$/.test(p)&&post){ const us=M.users.find(x=>x.jid===decodeURIComponent(p.split('/')[2])); if(!us) bad('User not found',404); us.warnings=0; mockLog('info','moderation','Warnings reset by admin'); return {ok:true}; }
  if(p===EP.logs){
    const s=g('q').toLowerCase(), lv=g('level'), ty=g('type');
    return paged(M.logs.filter(l=>(!s||l.message.toLowerCase().includes(s))&&(!lv||l.level===lv)&&(!ty||l.type===ty)));
  }
  bad(`Demo mode: no handler for ${method} ${p}`,404);
}

/* ---------- boot ---------- */
async function boot(){
  if(MOCK){ state.base='mock'; state.onboarded=true; showApp(); return; }
  if(!state.base){
    try{
      const saved=localStorage.getItem('sonicos.apiBase')||'';
      const sameOrigin=/^https?:$/.test(location.protocol)?location.origin:'';
      state.base=(DEFAULT_API_BASE||saved||sameOrigin).replace(/\/+$/,'');
    }catch{ state.base=(DEFAULT_API_BASE||(/^https?:$/.test(location.protocol)?location.origin:'')).replace(/\/+$/,''); }
  }
  if(!state.base){ showSetup(); return; }
  try{ state.onboarded = localStorage.getItem('sonicos.onboarded') === '1'; }catch{}
  try{
    const me=await api(EP.me);
    if(!me||!me.authenticated){ showLogin(); return; }
    await refreshStatus();
    if((state.status&&state.status.connected)||state.onboarded){ showApp(); }
    else{ showOnboard(); }
  }catch(e){
    if(e.status===401) showLogin();
    else if(e.status===503) showScreen(`<div class="logo"><i></i>SONICOS</div><h1>Dashboard disabled.</h1><p>${esc(e.message||'Set DASHBOARD_PASSWORD in your environment variables and restart the bot.')}</p>`);
    else showSetup(e.status===0?'Cannot reach that URL. Check that the bot is running and allows this origin (CORS).':e.message);
  }
}
$('#menu-btn').onclick=()=>{ const o=$('#side').classList.toggle('open'); $('#menu-btn').setAttribute('aria-expanded',String(o)); };
$('#signout').onclick=async()=>{ if(MOCK){ toast('Demo mode: sign-out is disabled'); return; } try{ await api(EP.logout,{method:'POST'}); }catch{} showLogin(); };
$('#off-retry').onclick=()=>{ refreshStatus().catch(()=>{}); };
$('#off-url').onclick=()=>showSetup();
boot();
